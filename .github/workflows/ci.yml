name: CI Pipeline

on:
  push:
    branches: [ main, master, "iteration-*" ]
  pull_request:
    branches: [ main, master, "iteration-*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfms_user
          POSTGRES_PASSWORD: cfms_password
          POSTGRES_DB: cfms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Branch Name Check
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          python -c "
          import os, re, json, sys

          branch = os.getenv('BRANCH_NAME', '')
          labels_json = os.getenv('LABELS', '[]')
          labels = json.loads(labels_json) if labels_json else []

          if 'skip-branch-name-check' in labels:
              print('Bypassing branch name check via skip-branch-name-check label.')
              sys.exit(0)

          pattern = r'^iteration-[0-9]+(-hotfix)?$'
          if not re.match(pattern, branch):
              print(f'PR source branch must match \"iteration-<N>[-hotfix]\"; got \"{branch}\".')
              sys.exit(1)

          print(f'Branch name \"{branch}\" matches policy.')
          "

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Import Smoke Check
        run: |
          pytest tests/test_import_smoke.py -x -q

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://cfms_user:cfms_password@localhost:5432/cfms_db
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://cfms_user:cfms_password@localhost:5432/cfms_db
          SECRET_KEY: ci-secret-key-12345
        run: |
          pytest

      - name: Free Port 5432 for Docker Compose
        run: |
          sudo systemctl stop postgresql 2>/dev/null || true
          docker ps -q --filter "ancestor=postgres:16-alpine" | xargs -r docker stop || true

      - name: Build and Run Docker Compose Services
        run: |
          docker compose up -d --build

      - name: Wait for Web Service Health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/auth/login > /dev/null; then
              echo "Web service is up!"
              exit 0
            fi
            echo "Waiting for web service..."
            sleep 2
          done
          echo "Web service failed to respond in time"
          docker compose logs web
          exit 1

      - name: Run End-to-End Container Smoke Tests
        run: |
          python -c "
          import httpx
          client = httpx.Client(base_url='http://localhost:8000', follow_redirects=True)
          login_res = client.post('/auth/login', data={'username': 'admin', 'password': 'admin123'})
          assert login_res.status_code == 200, f'Login failed: {login_res.status_code}'

          urls = [
              '/',
              '/admin/dashboard',
              '/admin/users',
              '/admin/computers',
              '/admin/technicians',
              '/admin/import',
              '/admin/import/template',
              '/admin/audit',
          ]
          for url in urls:
              res = client.get(url)
              assert res.status_code == 200, f'GET {url} failed with {res.status_code}'
          print('E2E Docker smoke test passed successfully!')
          "

      - name: Stop Docker Compose Services
        if: always()
        run: |
          docker compose down -v
