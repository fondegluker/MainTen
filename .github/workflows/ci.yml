name: CI Pipeline

on:
  push:
    branches: [ main, master, "iteration-*" ]
  pull_request:
    branches: [ main, master, "iteration-*" ]

jobs:
  lint_import_and_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cfms_user
          POSTGRES_PASSWORD: cfms_password
          POSTGRES_DB: cfms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Branch Name Check
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          python -c "
          import os, re, json, sys

          branch = os.getenv('BRANCH_NAME', '')
          labels_json = os.getenv('LABELS', '[]')
          labels = json.loads(labels_json) if labels_json else []

          if 'skip-branch-name-check' in labels:
              print('Bypassing branch name check via skip-branch-name-check label.')
              sys.exit(0)

          pattern = r'^iteration-[0-9]+(-hotfix)?$'
          if not re.match(pattern, branch):
              print(f'PR source branch must match \"iteration-<N>[-hotfix]\"; got \"{branch}\".')
              sys.exit(1)

          print(f'Branch name \"{branch}\" matches policy.')
          "

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Import Smoke Check
        run: |
          pytest tests/test_import_smoke.py -x -q

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://cfms_user:cfms_password@localhost:5432/cfms_db
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://cfms_user:cfms_password@localhost:5432/cfms_db
          SECRET_KEY: ci-secret-key-12345
        run: |
          pytest

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: lint_import_and_tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build and Start Docker Compose Stack
        run: |
          docker compose up -d --build

      - name: Wait for Web Service Health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/auth/login > /dev/null; then
              echo "Web service is up and healthy!"
              exit 0
            fi
            echo "Waiting for web service..."
            sleep 2
          done
          echo "Web service failed to respond in time"
          docker compose logs web
          exit 1

      - name: Run E2E Playwright Smoke Suite
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          pytest tests/e2e/ -x -q

      - name: Capture Docker Logs & Artifacts on Failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs > artifacts/app.log

      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure-artifacts
          path: artifacts/

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down -v
