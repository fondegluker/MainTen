{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 p-8 border border-gray-100 dark:border-gray-700 rounded-xl shadow-sm space-y-6 text-center">

        {{ t('reports_placeholder') }}

    <div class="pt-4">
