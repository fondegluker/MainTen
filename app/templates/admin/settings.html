{% extends "base.html" %}

{% block title %}{{ translate('settings', locale) }} - CFMS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-3xl font-bold text-gray-900">{{ translate('settings', locale) }}</h1>
        <form action="/admin/settings/reset" method="POST" onsubmit="return confirm('Сбросить все настройки к значениям по умолчанию?');">
            <button type="submit" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-semibold rounded-lg transition">
                Сбросить к умолчанию
            </button>
        </form>
    </div>

    {% if message %}
    <div class="p-4 bg-green-100 border border-green-300 text-green-800 rounded-lg text-sm font-medium">
        {{ message }}
    </div>
    {% endif %}

    {% if error %}
    <div class="p-4 bg-red-100 border border-red-300 text-red-800 rounded-lg text-sm font-medium">
        {{ error }}
    </div>
    {% endif %}

    <div class="bg-white p-6 border border-gray-200 rounded-xl shadow-sm space-y-6">
        <form action="/admin/settings" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Интервал ТО (24/7 ПК, месяцы)</label>
                    <input type="number" min="1" name="interval_rtc_months" value="{{ settings.interval_rtc_months }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Интервал ТО (Обычные ПК, месяцы)</label>
                    <input type="number" min="1" name="interval_non_rtc_months" value="{{ settings.interval_non_rtc_months }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ширина окна выбора даты (дни)</label>
                    <input type="number" min="1" name="selection_window_days" value="{{ settings.selection_window_days }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Смещение начала напоминаний (дни)</label>
                    <input type="number" min="0" name="prompt_start_offset_days" value="{{ settings.prompt_start_offset_days }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Дневная норма техника (ТО / день)</label>
                    <input type="number" min="1" name="technician_daily_capacity" value="{{ settings.technician_daily_capacity }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Часовой пояс (Timezone)</label>
                    <input type="text" name="timezone" value="{{ settings.timezone }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="flex items-center gap-2 pt-2 border-t">
                <input type="checkbox" id="allow_short_days" name="allow_short_days" {% if settings.allow_short_days %}checked{% endif %} class="w-4 h-4 text-indigo-600 rounded">
                <label for="allow_short_days" class="text-sm font-medium text-gray-700">Разрешить сокращенные дни как рабочие для планирования ТО</label>
            </div>

            <div class="flex justify-end pt-4 border-t">
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition">
                    Сохранить настройки
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
