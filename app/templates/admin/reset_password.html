{% extends "base.html" %}

{% block title %}Сброс пароля пользователя - CFMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-xl shadow-sm space-y-6">
    <h1 class="text-2xl font-bold text-gray-900">Сброс пароля</h1>
    <p class="text-sm text-gray-600">
        Пользователь: <strong>{{ edit_user.username }}</strong> ({{ edit_user.email_or_login }})
    </p>

    <form action="/admin/users/{{ edit_user.id }}/reset-password" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="new_password">Новый пароль *</label>
            <input type="password" id="new_password" name="new_password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex items-center justify-end space-x-3 pt-4 border-t">
            <a href="/admin/users" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md font-medium hover:bg-gray-300 transition">{{ translate('cancel', locale) }}</a>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md font-medium hover:bg-indigo-700 transition">Сбросить пароль</button>
        </div>
    </form>
</div>
{% endblock %}
