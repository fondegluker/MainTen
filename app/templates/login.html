{% extends "base.html" %}

{% block title %}{{ translate('login', locale) }} - CFMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ translate('login', locale) }}</h2>

    {% if error %}
    <div class="mb-4 p-3 bg-red-100 border border-red-300 text-red-700 rounded-md text-sm">
        {{ translate(error, locale) }}
    </div>
    {% endif %}

    <form action="/auth/login" method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="username">
                {{ translate('username_or_email', locale) }}
            </label>
            <input type="text" id="username" name="username" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="password">
                {{ translate('password', locale) }}
            </label>
            <input type="password" id="password" name="password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <button type="submit"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-md shadow focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            {{ translate('sign_in', locale) }}
        </button>
    </form>
</div>
{% endblock %}
