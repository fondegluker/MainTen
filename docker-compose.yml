version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cfms_db
    restart: always
    environment:
      POSTGRES_USER: cfms_user
      POSTGRES_PASSWORD: cfms_password
      POSTGRES_DB: cfms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfms_user -d cfms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cfms_web
    restart: always
    environment:
      DATABASE_URL: postgresql://cfms_user:cfms_password@db:5432/cfms_db
      SECRET_KEY: cfms-production-secret-key-change-in-production-998877
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
